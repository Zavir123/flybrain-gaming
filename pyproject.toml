[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flybrain-gaming"
version = "0.1.0"
description = "A cross-platform Python arcade shooter with a connectome controller"
requires-python = ">=3.11"
dependencies = ["pygame-ce>=2.5.3,<3", "numpy>=1.26,<3", "scipy>=1.12,<2", "pyarrow>=16,<27"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
flybrain = "flybrain.__main__:main"

[tool.setuptools.packages.find]
include = ["flybrain*"]

[tool.setuptools.package-data]
flybrain = ["assets/fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
